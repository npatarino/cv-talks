<!-- ───────── Contribution graph background ─────────
     Cuadrícula tipo "actividad de GitHub". Cada casilla sube de verde con sus
     primeros commits y, si la actividad no para, se va calentando hacia el rojo
     por su cuenta. La lluvia de commits se acelera hasta que NINGUNA casilla
     queda libre ni por debajo del rojo máximo; entonces vibra y explota. -->
<div id="contrib-bg" style="position:absolute;inset:0;width:100%;height:100%;overflow:hidden"></div>
<script>
(function () {
  var MOUNT = document.getElementById('contrib-bg');
  if (!MOUNT) return;
  if (MOUNT.__contribCleanup) MOUNT.__contribCleanup();

  var BG = [13, 17, 23];
  var EMPTY = [22, 27, 34];
  var GREENS = [[14, 68, 41], [0, 109, 50], [38, 166, 65], [57, 211, 83]];
  var RED_MAX = [255, 32, 121];                 // plasma: rojo máximo
  var RED_MID = [166, 65, 50];
  var CELL = 20, GAP = 5;                       // px del lienzo 1920×1080
  var RAMP_MS = 24000;                          // tiempo hasta la lluvia máxima
  var HOLD_MS = 1300, BOOM_MS = 1800, DARK_MS = 1600;
  var HEAT_STEP = 0.2;                          // calor que añade cada commit a una casilla ya verde máximo

  MOUNT.style.background = 'rgb(' + BG.join(',') + ')';
  if (getComputedStyle(MOUNT).position === 'static') MOUNT.style.position = 'relative';
  var canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
  MOUNT.appendChild(canvas);
  var ctx = canvas.getContext('2d', { alpha: false });

  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix3(c1, c2, t) { return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
  function rgb(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
  function easeIn(t) { return t * t * t; }
  function clamp(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }

  var W = 0, H = 0, dpr = 1, cols = 0, rows = 0, cells = [], pitch = 0, cellPx = 0;
  // Zonas de texto (logo, título, firma) en fracciones del lienzo. Las casillas
  // que caen dentro no existen, con un umbral distinto por casilla para que el
  // borde no dibuje una elipse limpia sino un "claro" irregular en la cuadrícula.
  var QUIET = [
    { x: 0.5, y: 0.145, rx: 0.13, ry: 0.085 },  // logo
    { x: 0.5, y: 0.60,  rx: 0.40, ry: 0.15 },   // título
    { x: 0.5, y: 0.775, rx: 0.18, ry: 0.05 }    // with ♥ by …
  ];
  function quietAt(x, y, seed) {
    var m = 0;
    for (var i = 0; i < QUIET.length; i++) {
      var q = QUIET[i], dx = (x - q.x * W) / (q.rx * W), dy = (y - q.y * H) / (q.ry * H);
      var d = dx * dx + dy * dy;                   // 0 en el centro, 1 en el borde
      if (d < 1.4) m = Math.max(m, 1 - d / 1.4);
    }
    if (!m) return 0;
    m = m * m * (3 - 2 * m);                        // suavizado
    // Umbral por casilla: borde dentado en lugar de una elipse limpia.
    return clamp(m * 1.1 + (seed - 0.5) * 0.45);
  }

  function layout() {
    var r = MOUNT.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(r.width)); H = Math.max(1, Math.floor(r.height));
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    var scale = W / 1920;
    pitch = (CELL + GAP) * scale; cellPx = CELL * scale;
    cols = Math.ceil(W / pitch) + 1; rows = Math.ceil(H / pitch) + 1;
    var old = cells; cells = [];
    for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
      var prev = old[y * cols + x];
      var seed = prev ? prev.seed : Math.random();
      var c = { lvl: prev ? prev.lvl : 0, heat: prev ? prev.heat : 0, hit: -1e9, seed: seed, dx: 0, dy: 0, vx: 0, vy: 0, skip: false };
      // Las casillas bajo los textos no existen: hueco con borde irregular.
      c.skip = quietAt(x * pitch + cellPx / 2, y * pitch + cellPx / 2, seed) > 0.5;
      cells.push(c);
    }
  }
  function cellColor(c, now) {
    var base = c.lvl === 0 ? EMPTY : GREENS[c.lvl - 1];
    var col = base;
    if (c.heat > 0) {
      // Verde → rojo medio → rojo máximo, en función del calor propio de la casilla.
      col = c.heat < 0.5 ? mix3(base, RED_MID, c.heat / 0.5) : mix3(RED_MID, RED_MAX, (c.heat - 0.5) / 0.5);
    }
    var age = now - c.hit;
    if (age < 220 && c.lvl) col = mix3(col, [255, 255, 255], (1 - age / 220) * 0.3);
    return col;
  }
  function hitCell(c, now) {
    if (c.lvl < 3) c.lvl += 1; else c.heat = Math.min(1, c.heat + HEAT_STEP);
    c.hit = now;
  }
  function isDone(c) { return c.skip || c.heat >= 1; }

  var state, phaseStart, startTime;
  function reset(now) {
    for (var i = 0; i < cells.length; i++) { var c = cells[i]; c.lvl = 0; c.heat = 0; c.hit = -1e9; c.dx = c.dy = c.vx = c.vy = 0; }
    state = 'fill'; phaseStart = now; startTime = now;
  }

  function render(now, dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = rgb(BG); ctx.fillRect(0, 0, W, H);
    var p = (now - phaseStart);
    if (state === 'fill') {
      var ramp = Math.min(1, (now - startTime) / RAMP_MS);
      var rate = lerp(0.4, 90, easeIn(ramp)) * dt / 16;       // commits por frame
      var n = Math.floor(rate) + (Math.random() < (rate % 1) ? 1 : 0);
      var pending = null;
      for (var i = 0; i < n; i++) {
        var c;
        if (ramp > 0.8) {
          // Final: la lluvia se ceba con lo que falta hasta que todo esté al rojo.
          if (!pending) { pending = []; for (var k = 0; k < cells.length; k++) if (!isDone(cells[k])) pending.push(cells[k]); }
          if (!pending.length) break;
          c = pending[(Math.random() * pending.length) | 0];
        } else {
          c = cells[(Math.random() * cells.length) | 0];
        }
        if (!c.skip) hitCell(c, now);
      }
      if (ramp >= 1) {
        var allDone = true;
        for (var q = 0; q < cells.length; q++) if (!isDone(cells[q])) { allDone = false; break; }
        if (allDone) { state = 'hold'; phaseStart = now; }
      }
    } else if (state === 'hold' && p > HOLD_MS) { state = 'boom'; phaseStart = now; }
    else if (state === 'boom' && p > BOOM_MS) { state = 'dark'; phaseStart = now; }
    else if (state === 'dark' && p > DARK_MS) { reset(now); }

    var cx = W / 2, cy = H / 2;
    var hotAvg = 0;
    for (var j = 0; j < cells.length; j++) {
      var c2 = cells[j];
      if (c2.skip) continue;
      var x = (j % cols) * pitch, y = Math.floor(j / cols) * pitch, alpha = 1;
      var col = cellColor(c2, now);
      hotAvg += c2.heat;
      if (state === 'fill' || state === 'hold') {
        // Vibración y parpadeo proporcionales al calor de cada casilla.
        if (c2.heat > 0.4) {
          var h = (c2.heat - 0.4) / 0.6 * (state === 'hold' ? 1.6 : 1);
          var fl = (Math.sin(now / (40 + c2.seed * 60) + c2.seed * 9) * 0.5 + 0.5) * h * 0.35;
          col = mix3(col, RED_MAX, fl);
          var jit = h * h * 3;
          x += (Math.random() - 0.5) * jit; y += (Math.random() - 0.5) * jit;
        }
      } else if (state === 'boom') {
        if (c2.vx === 0 && c2.vy === 0) {
          var ddx = x - cx, ddy = y - cy, d = Math.max(40, Math.hypot(ddx, ddy));
          var sp = (0.35 + c2.seed * 0.45) * (W / 1920) * Math.min(3, 1 + 160 / d);
          c2.vx = ddx / d * sp + (c2.seed - 0.5) * 0.15; c2.vy = ddy / d * sp + (c2.seed - 0.5) * 0.15;
        }
        c2.dx += c2.vx * dt; c2.dy += c2.vy * dt; c2.vy += 0.0004 * dt * (W / 1920);
        x += c2.dx; y += c2.dy;
        var bp = p / BOOM_MS;
        col = mix3(RED_MAX, [255, 120, 160], Math.min(1, bp * 1.5));
        alpha = Math.max(0, 1 - bp * bp);
      } else if (state === 'dark') {
        col = mix3(EMPTY, BG, p / DARK_MS * 0.6); alpha = 1 - p / DARK_MS;
      }
      ctx.globalAlpha = alpha; ctx.fillStyle = rgb(col);
      ctx.fillRect(x, y, cellPx, cellPx);
    }
    ctx.globalAlpha = 1;
    if (state === 'boom' && p < 450) {
      ctx.fillStyle = 'rgba(255,32,121,' + (0.45 * (1 - p / 450)) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  layout();
  var inEditorPreview = (window.self !== window.top) && !/[?&](present|embedded)=/.test(location.search);
  if (inEditorPreview) {
    // Fotograma fijo para la miniatura del editor: a medio camino, sin rAF.
    var seed = function () { for (var q = 0; q < cells.length; q++) { var c = cells[q]; c.lvl = Math.random() < 0.6 ? 1 + ((Math.random() * 3) | 0) : 0; c.heat = c.lvl === 3 && Math.random() < 0.4 ? Math.random() * 0.6 : 0; } };
    seed(); state = 'fill'; phaseStart = startTime = performance.now() - RAMP_MS * 0.5;
    render(performance.now(), 0);
    var ro = new ResizeObserver(function () { layout(); seed(); render(performance.now(), 0); });
    ro.observe(MOUNT);
    MOUNT.__contribCleanup = function () { ro.disconnect(); canvas.remove(); MOUNT.__contribCleanup = null; };
    return;
  }

  reset(performance.now());
  var last = performance.now(), raf = 0, stopped = false;
  function frame(now) {
    if (stopped) return;
    render(now, Math.min(50, now - last)); last = now;
    raf = requestAnimationFrame(frame);
  }
  var ro2 = new ResizeObserver(function () { layout(); });
  ro2.observe(MOUNT);
  canvas.addEventListener('click', function () { reset(performance.now()); });
  MOUNT.__contribCleanup = function () { stopped = true; cancelAnimationFrame(raf); ro2.disconnect(); canvas.remove(); MOUNT.__contribCleanup = null; };
  raf = requestAnimationFrame(frame);
})();
</script>
