<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 120" style="width:1520px;height:120px;overflow:visible" fill="none" stroke="#fafaf8" stroke-linecap="round" stroke-linejoin="round">
<style>
/* Desplazamiento por toda la slide, en bucle. */
.ir-run { animation: ir-run 7s linear infinite; }
@keyframes ir-run { from { transform: translateX(-80px); } to { transform: translateX(1560px); } }
/* Ciclo de carrera: 0.6 s por zancada completa (dos apoyos). */
.ir-body { animation: ir-bob .3s ease-in-out infinite; }
@keyframes ir-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.ir-th { animation: ir-thigh .6s linear infinite; }
.ir-sh { animation: ir-shin .6s linear infinite; }
.ir-ua { animation: ir-upper .6s linear infinite; }
.ir-fa { animation: ir-fore .6s linear infinite; }
/* Pierna/brazo B: media zancada de desfase. */
.ir-b .ir-th, .ir-b .ir-sh, .ir-b .ir-ua, .ir-b .ir-fa { animation-delay: -.3s; }
/* Ángulos: muslo desde la vertical (negativo = hacia delante en pantalla,
   porque y crece hacia abajo); rodilla = flexión de la pantorrilla. */
@keyframes ir-thigh {
  0% { transform: rotate(-45deg); } 12.5% { transform: rotate(-28deg); } 25% { transform: rotate(-8deg); }
  37.5% { transform: rotate(14deg); } 50% { transform: rotate(30deg); } 62.5% { transform: rotate(22deg); }
  75% { transform: rotate(-8deg); } 87.5% { transform: rotate(-38deg); } 100% { transform: rotate(-45deg); } }
@keyframes ir-shin {
  0% { transform: rotate(22deg); } 12.5% { transform: rotate(12deg); } 25% { transform: rotate(18deg); }
  37.5% { transform: rotate(38deg); } 50% { transform: rotate(78deg); } 62.5% { transform: rotate(112deg); }
  75% { transform: rotate(104deg); } 87.5% { transform: rotate(58deg); } 100% { transform: rotate(22deg); } }
/* Brazos en oposición a las piernas, codo ~90º. */
@keyframes ir-upper {
  0% { transform: rotate(42deg); } 25% { transform: rotate(12deg); } 50% { transform: rotate(-22deg); }
  75% { transform: rotate(8deg); } 100% { transform: rotate(42deg); } }
@keyframes ir-fore {
  0% { transform: rotate(-96deg); } 25% { transform: rotate(-84deg); } 50% { transform: rotate(-68deg); }
  75% { transform: rotate(-82deg); } 100% { transform: rotate(-96deg); } }
</style>
<g class="ir-run"><g class="ir-body"><g transform="translate(40 62) scale(.95)">
  <!-- Pierna B (trasera, debajo) -->
  <g class="ir-b"><g class="ir-th">
    <path stroke-width="3.6" d="M0 0 L0 21"/><path stroke-width="1.3" opacity=".7" d="M1.6 2 L1.6 20"/>
    <g transform="translate(0 21)"><g class="ir-sh">
      <path stroke-width="3.4" d="M0 0 L0 20"/><path stroke-width="1.3" opacity=".7" d="M1.4 2 L1.4 19"/>
      <path stroke-width="3" d="M-1 20 L8 20 L9 16"/>
    </g></g>
  </g></g>
  <!-- Brazo B (trasero) -->
  <g transform="translate(9 -31)"><g class="ir-b"><g class="ir-ua">
    <path stroke-width="3.2" d="M0 0 L0 16"/>
    <g transform="translate(0 16)"><g class="ir-fa"><path stroke-width="3" d="M0 0 L0 15"/><path stroke-width="1.2" opacity=".7" d="M1.3 2 L1.3 14"/></g></g>
  </g></g></g>
  <!-- Tronco con relleno de rotulador, inclinado hacia delante -->
  <g transform="rotate(-12)">
    <path fill="#f9d71c" stroke="none" d="M-5 -30 L10 -32 L9 -8 L-3 -4 Z" transform="translate(1.4 1.2)"/>
    <path fill="#02b5b9" stroke="none" d="M-6 -6 L9 -8 L8 4 L-5 5 Z" transform="translate(1.2 1)"/>
    <path stroke-width="3.8" d="M0 0 C1 -12 2 -22 3 -32"/>
    <path stroke-width="1.4" opacity=".7" d="M2.2 -2 C3 -12 3.6 -20 4.6 -30"/>
    <!-- cabeza con gorra -->
    <path fill="#a64132" stroke="none" d="M-3 -44 L14 -45 L13 -40 L-3 -39 Z" transform="translate(1.2 1)"/>
    <path stroke-width="3.6" d="M-3 -40 C-4 -50 10 -53 13 -44 C15 -36 8 -30 2 -31 C-2 -32 -4 -36 -3 -40"/>
    <path stroke-width="1.3" opacity=".7" d="M-1 -41 C-1 -48 8 -50 11 -44"/>
    <path stroke-width="3" d="M-3 -42 L15 -43"/>
  </g>
  <!-- Brazo A (delantero) -->
  <g transform="translate(9 -31)"><g class="ir-a"><g class="ir-ua">
    <path stroke-width="3.2" d="M0 0 L0 16"/><path stroke-width="1.2" opacity=".7" d="M1.3 2 L1.3 13"/>
    <g transform="translate(0 16)"><g class="ir-fa"><path stroke-width="3" d="M0 0 L0 15"/><path stroke-width="1.2" opacity=".7" d="M1.3 2 L1.3 14"/></g></g>
  </g></g></g>
  <!-- Pierna A (delantera, encima) -->
  <g class="ir-a"><g class="ir-th">
    <path stroke-width="3.6" d="M0 0 L0 21"/><path stroke-width="1.3" opacity=".7" d="M1.6 2 L1.6 20"/>
    <g transform="translate(0 21)"><g class="ir-sh">
      <path stroke-width="3.4" d="M0 0 L0 20"/><path stroke-width="1.3" opacity=".7" d="M1.4 2 L1.4 19"/>
      <path stroke-width="3" d="M-1 20 L8 20 L9 16"/>
    </g></g>
  </g></g>
  <!-- líneas de velocidad -->
  <g stroke="#f9d71c" stroke-width="2.6"><path d="M-30 -30 L-20 -29"/><path d="M-34 -18 L-22 -18"/><path d="M-30 -6 L-20 -7"/></g>
</g></g></g>
</svg>
