<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="overflow:visible" fill="none" stroke="#fafaf8" stroke-linecap="round" stroke-linejoin="round">
<style>
/* El fósforo se enciende, la llama baja y deja el palo carbonizado hasta el 65 %;
   el cuarto inferior queda sin quemar. Nada desaparece: la cabeza se vuelve negra. */
.fm-travel { animation: fm-travel 2.6s linear .9s forwards; }
.fm-burnt { opacity: 0; animation: fm-burn 2.6s linear .9s forwards; }
.fm-headblack { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: fm-headin .6s ease-in .9s forwards; }
.fm-ignite { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; transform: scale(.2); animation: fm-pop .3s cubic-bezier(.3,1.6,.5,1) .8s forwards, fm-out .45s ease-in 3.35s forwards; }
.fm-flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: fm-flick .16s ease-in-out .8s infinite alternate; }
.fm-smoke { opacity: 0; animation: fm-smoke 2.4s ease-out 3.6s infinite; }
@keyframes fm-travel { to { transform: translateY(215px); } }
@keyframes fm-burn { 0% { opacity: 0; height: 0; } 3% { opacity: 1; } 100% { opacity: 1; height: 215px; } }
@keyframes fm-headin { to { opacity: 1; transform: scale(.85); } }
@keyframes fm-pop { to { opacity: 1; transform: scale(1); } }
@keyframes fm-out { to { opacity: 0; transform: scale(.3); } }
@keyframes fm-flick { from { transform: scale(1,1) rotate(-3deg); } to { transform: scale(.92,1.12) rotate(4deg); } }
@keyframes fm-smoke { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-120px); } }
</style>
<!-- palo sin quemar, entero -->
<rect fill="#f9d71c" stroke="none" x="242" y="135" width="40" height="330" rx="18"/>
<rect stroke-width="16" x="236" y="128" width="40" height="330" rx="18"/>
<!-- parte carbonizada: crece de arriba abajo detrás de la llama -->
<rect class="fm-burnt" fill="#1c1c1c" stroke="#fafaf8" stroke-width="16" x="236" y="128" width="40" height="0" rx="18"/>
<!-- cabeza -->
<path fill="#a64132" stroke="none" transform="translate(6 7)" d="M256 60 c26 0 40 24 40 50 c0 24 -16 40 -40 40 c-24 0 -40 -16 -40 -40 c0 -26 14 -50 40 -50 Z"/>
<path stroke-width="16" d="M256 60 c26 0 40 24 40 50 c0 24 -16 40 -40 40 c-24 0 -40 -16 -40 -40 c0 -26 14 -50 40 -50 Z"/>
<!-- cabeza quemada: aparece encima y se encoge un poco -->
<g class="fm-headblack">
<path fill="#1c1c1c" stroke="#fafaf8" stroke-width="16" d="M256 60 c26 0 40 24 40 50 c0 24 -16 40 -40 40 c-24 0 -40 -16 -40 -40 c0 -26 14 -50 40 -50 Z"/>
<path stroke-width="6" opacity=".6" d="M236 92 l12 10 M262 84 l10 12 M244 120 l10 -8"/>
</g>
<!-- llama, viaja por el palo -->
<g class="fm-travel">
<g class="fm-ignite"><g class="fm-flicker">
<path fill="#f9d71c" stroke="none" transform="translate(5 5)" d="M256 110 c-44 -36 -44 -82 -8 -112 c-4 28 14 36 22 20 c26 22 34 66 -14 92 Z"/>
<path stroke-width="14" d="M256 110 c-44 -36 -44 -82 -8 -112 c-4 28 14 36 22 20 c26 22 34 66 -14 92 Z"/>
<path fill="#fafaf8" stroke="none" d="M256 98 c-18 -16 -16 -40 0 -52 c16 12 18 36 0 52 Z"/>
</g></g>
</g>
<!-- humo, desde donde se detuvo la llama -->
<path class="fm-smoke" stroke-width="12" d="M258 340 c-18 -22 12 -36 -6 -62 c-16 -22 10 -38 -4 -66"/>
<path class="fm-smoke" stroke-width="9" style="animation-delay: 4.6s" d="M250 340 c14 -20 -10 -34 6 -58 c14 -20 -8 -36 4 -60"/>
</svg>
